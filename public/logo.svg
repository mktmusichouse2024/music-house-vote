<svg viewBox="0 0 1000 1000" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Base circle background with precise brand blue color -->
  <circle cx="500" cy="500" r="500" fill="#0082f6" />
  
  <g>
    <!-- Stylized grand piano line art in white, scaled up and centered -->
    <g transform="translate(-355, -160) scale(1.5)">
      <path 
        d="M370 445 L760 445" 
        stroke="white" 
        stroke-width="10" 
        stroke-linecap="round" 
      />
      <path 
        d="M472 214 L552 425" 
        stroke="white" 
        stroke-width="10" 
        stroke-linecap="round" 
      />
      <path 
        d="M374 388 L484 238 C530 208 590 208 590 248 C590 298 710 318 760 318 C770 318 770 338 750 354 C680 408 630 438 560 445" 
        stroke="white" 
        stroke-width="10" 
        stroke-linecap="round" 
        fill="none" 
      />
    </g>
    
    <!-- Thick horizontal white stripe -->
    <rect x="0" y="505" width="1000" height="24" fill="white" />
    
    <!-- Text: MUSIC HOUSE in bold sans-serif, using natural width so it doesn't squish -->
    <text 
      x="500" 
      y="635" 
      fill="white" 
      font-size="115" 
      font-weight="900" 
      font-family="Montserrat, 'Segoe UI', Arial, sans-serif" 
      text-anchor="middle" 
      letter-spacing="2"
    >MUSIC HOUSE</text>
    
    <!-- Thin horizontal white stripe -->
    <rect x="0" y="672" width="1000" height="10" fill="white" />
  </g>
</svg>
